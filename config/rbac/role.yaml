  resources:
  - k1sapps
  - k1sclusters
  - k1sexposures
  - k1sinferenceendpoints
  - k1sresourcesets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.k1s.io
  resources:
  - k1sapps/finalizers
  - k1sinferenceendpoints/finalizers
  - k1sresourcesets/finalizers
  verbs:
  - update

apiVersion: operator.k1s.io/v1alpha1
kind: K1sInferenceEndpoint
metadata:
  name: llama-smoke
  namespace: k1s-operator-system
spec:
  clusterRef:
    name: dev-a
  model:
    modelId: meta-llama/Llama-3.2-1B-Instruct
  parallelism:
    tp: 1
    pp: 1
  executor:
    type: ray
    dtype: float16
    runtimeClassName: nvidia
  fabric:
    mode: lan_direct
    policyMode: strict_membership
    ttlSeconds: 300
  members:
  - siteId: local
    nodeId: gpu-node-0
    gpuCount: 1
  deletePolicy: Delete
